<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1220"><title>AFK Bot Login</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white grid place-items-center p-4"><form id="login" class="w-full max-w-sm rounded-2xl bg-slate-900 border border-slate-700 p-7 space-y-5"><h1 class="text-2xl font-bold">AFK Bot <span class="text-cyan-400">v3</span></h1><p class="text-slate-400">Sign in to your dashboard.</p><input id="password" type="password" required placeholder="Dashboard password" class="w-full rounded-lg bg-slate-800 p-3 outline-none focus:ring-2 focus:ring-cyan-500"><button class="w-full rounded-lg bg-cyan-500 p-3 font-semibold text-slate-950">Login</button><p id="error" class="text-sm text-red-400"></p></form><script>document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#password').value})});if(r.ok)location.href='/';else document.querySelector('#error').textContent='Login failed. Check your password.';});</script></body></html>
